name: Verify Inline Chat MVP
on:
  push:
  pull_request:
jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check server JavaScript syntax
        run: node --check server.mjs
      - name: Check inline JavaScript syntax
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('index.html','utf8');const a=s.lastIndexOf('<script>');const b=s.indexOf('</script>',a);if(a<0||b<0)throw Error('Missing inline script');fs.writeFileSync('/tmp/inline.js',s.slice(a+8,b))"
          node --check /tmp/inline.js
      - name: Run proxy and streaming tests
        run: node --test server.test.mjs stream.test.mjs
  browser-inline-interactions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test inline review buttons in Chromium
        run: node --test ui.test.mjs
