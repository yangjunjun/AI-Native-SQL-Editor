name: Verify Inline Chat MVP
on:
  push:
  pull_request:
jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check server JavaScript syntax
        run: node --check server.mjs
      - name: Check inline JavaScript syntax
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('index.html','utf8');const matches=[...s.matchAll(/<script>([\\s\\S]*?)<\\/script>/g)];if(!matches.length)throw Error('Missing inline script');fs.writeFileSync('/tmp/inline.js',matches.at(-1)[1])"
          node --check /tmp/inline.js
      - name: Run proxy tests
        run: node --test server.test.mjs
